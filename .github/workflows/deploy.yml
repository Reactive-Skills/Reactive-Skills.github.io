name: Deploy Reactive Skills site

on:
  repository_dispatch:
    types:
      - source-updated
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source repository ref to build
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: Reactive-Skills/reactive-skills
          ref: ${{ github.event.client_payload.source_ref || inputs.source_ref || 'main' }}
          path: source

      - name: Checkout published skill registry
        uses: actions/checkout@v4
        with:
          repository: Reactive-Skills/skills
          ref: main
          path: skills

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Synchronize published skill registry
        working-directory: source
        run: pnpm run sync:registry

      - name: Verify generated registry membership
        working-directory: source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { registrySkills } from './apps/site/src/infrastructure/content/registry/skills.js';
          const published = fs.readdirSync('../skills', { withFileTypes: true })
            .filter(entry => entry.isDirectory() && fs.existsSync(`../skills/${entry.name}/skill.yaml`))
            .map(entry => entry.name)
            .sort();
          assert(published.length > 0, 'Published skill registry is empty');
          assert.deepEqual(registrySkills.map(skill => skill.slug).sort(), published,
            'Generated registry must contain every published skill exactly once');
          console.log(`Verified ${published.length} published skills`);
          NODE

      - name: Build documentation site
        working-directory: source
        env:
          NEXT_PUBLIC_SITE_URL: https://reactive-skills.github.io
          NEXT_PUBLIC_ROOT_SITE: "true"
          GITHUB_PAGES: "true"
        run: pnpm --filter @reactive-skills/site build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/apps/site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
